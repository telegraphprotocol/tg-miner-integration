version: "1"
kind: miner
id: 32
slug: bittensor-sn32-itsai
protocol: bittensor
name: ItsAI Text Detector (Bittensor SN32)
description: >
  Bittensor Subnet 32 — ItsAI detects whether text was written by a human or
  generated by an AI. The autonomous engine can use ItsAI for content
  authenticity verification before acting on text-based signals.
base_url: https://api.its-ai.org/api

docs:
  website: https://its-ai.org
  documentation: https://docs.its-ai.org
  repository: https://github.com/its-ai/subnet-32

limitations:
  - code: MAX_PARAM_VALUE
    message: Text samples under 200 characters are rejected by the upstream API.
    param: text
    property: length
    value_num: 200
    operator: gte

auth:
  type: header
  header_name: Authorization
  # env_var is not read by the node — install the real key after registering,
  # via Dashboard -> API Key (wallet-signed, POST /miner-dispatcher/miners/{slug}/api-key).

rate_limit_per_sec: 10
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

endpoints:
  - path: /detect
    external_path: /text
    method: POST
    description: Detect whether a piece of text is AI-generated.

semantics:
  signal_mapping:
    confidence_field: answer
    label_field: answer
    reason_field: status
  supported_intents:
    - AI_TEXT_DETECTION

on_chain:
  transform: direct
  min_price_usdc: 0.01
  fields:
    integers:
      - index: 0
        name: answer_x100
        source_path: answer
        multiplier: 100
    bools:
      - index: 0
        name: is_ai_generated
        source_path: answer
        transform_rule: bool_from_eq:1
  request:
    - endpoint: detect
      method: POST
      body:
        text: { source: strings.0 }
