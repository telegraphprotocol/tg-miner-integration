version: "1"
kind: miner
id: 101
slug: sapling-ai-detector
protocol: generic
name: Sapling AI Detector
description: >
  Sapling's AI Content Detector — detects whether a piece of text was
  written by a human or generated by AI. The autonomous engine can use
  Sapling for content authenticity verification before acting on
  text-based signals.
base_url: https://api.sapling.ai

docs:
  website: https://sapling.ai
  documentation: https://sapling.ai/docs/api/detector-quickstart

limitations:
  - code: MAX_PARAM_VALUE
    message: Text samples must be non-empty.
    param: text
    property: length
    value_num: 1
    operator: gte

auth:
  type: header
  header_name: X-API-Key
  env_var: SAPLING_API_KEY

rate_limit_per_sec: 5
cache_ttl_sec: 300
circuit_threshold: 5
circuit_cooldown_seconds: 60

endpoints:
  - path: /detect
    external_path: /api/v1/aidetect
    method: POST
    description: Detect whether a piece of text is AI-generated.

semantics:
  signal_mapping:
    confidence_field: score
    label_field: score
    reason_field: sentence_scores
  supported_intents:
    - AI_DETECTION

on_chain:
  transform: direct
  min_price_usdc: 0.01
  fields:
    integers:
      - index: 0
        name: score_x10000
        source_path: score
        multiplier: 10000
  request:
    - endpoint: detect
      method: POST
      body:
        text: { source: strings.0 }
